<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AnalyticsFm</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename= 'style.css') }}"
    />
  </head>
  <body>
    <div id="container">
      <header>
        <h2 class="logo">AnalyticsFm</h2>
        <i class="fa-solid fa-bars" id="mostrar"></i>
        <nav id="navegacao">
          <form action="">
            <div id="area_input">
              <input
                type="text"
                id="username"
                placeholder="Usuario do LastFm"
                required
              />
              <button type="button" id="buscar">Buscar</button>
              <p class="alerta">User não encontrado</p>
              </div>
              <div id="selecao">
                <select name="metodos" id="metodos" required>
                  <option value="" disabled selected>Selecione uma Opção</option>
                  <option value="Artistas">Artistas</option>
                  <option value="Musicas">Musicas</option>
                  <option value="Albuns">Albuns</option>
                </select>
                <select name="periodos" id="periodos" required>
                  <option value="" disabled selected>Selecione uma Opção</option>
                  <option value="7">7 Dias</option>
                  <option value="30">30 Dias</option>
                  <option value="90">90 dias</option>
                  <option value="180">180 dias</option>
                  <option value="365">365 dias</option>
                  <option value="tudo">Tudo</option>
                </select>
                <select name="limite" id="limite">
                  <option value="5">5</option>
                  <option value="10" selected>10</option>
                  <option value="15">15</option>
                  <option value="20">20</option>
                  <option value="25">25</option>
                  <option value="50">50</option>
                </select>
              </div>
        </nav>
        </form>
      </header>
      <main>
        <section class="sessao">
          <div class="ranking">
            <div id="tops" class=""></div>
          </div>
        </section>
      </main>
      <footer>
        <p>feito por diversão :P</p>
      </footer>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
  </body>
</html>
